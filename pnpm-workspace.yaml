packages:
  - "open-sse"
  - "packages/browser-pool"
  - "packages/ui-kit"

# scripts/build/assembleStandalone.mjs needs a flat node_modules: with pnpm's isolated
# layout the standalone bundle loses better-sqlite3 (silent node:sqlite fallback) and
# keeps absolute symlinks into the build machine. Dereferencing those copies is not
# enough, because a package lifted out of .pnpm loses its sibling dependencies.
nodeLinker: hoisted

# OmniRoute imports only the deep icon modules from @lobehub/icons; auto-installing
# its unused @lobehub/ui peer pulls a large UI subtree (including packages without
# distributable licenses).
autoInstallPeers: false

# Never reinstall implicitly before `pnpm run` / `pnpm exec`.
verifyDepsBeforeRun: false

# Network resilience: retry a transient registry socket reset instead of failing.
fetchRetries: 5
fetchRetryFactor: 4
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000

allowBuilds:
  "@huggingface/transformers": true
  "@parcel/watcher": true
  "@playwright/browser-chromium": true
  "@swc/core": true
  better-sqlite3: true
  bun: true
  core-js: true
  esbuild: true
  keytar: true
  libxmljs2: true
  # Its postinstall downloads CUDA binaries; the package already bundles the CPU ones.
  onnxruntime-node: false
  opencode-ai: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Security and compatibility pins, ported from npm's package.json `overrides`.
# pnpm 12 reads overrides from this file only.
overrides:
  "browserslist": "^4.28.8"
  "joi": "^18.2.9"
  "onnxruntime-node": "1.30.0"
  "eslint-plugin-react-hooks": "7.1.1"
