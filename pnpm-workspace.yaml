  "qs": "^6.16.1"
  "uuid": "^14.0.3"
  "form-data": "^4.0.6"
  "vite": "^8.3.6"
  "protobufjs": "^7.6.5"
  "@babel/core": "^7.29.6"
  "hono": "^4.13.13"
  "@hono/node-server": "^2.1.3"
  "fast-uri": "^3.1.9"
