name: CI

# The fork's CI blocks on correctness only: lint, types, builds, tests, security scans and
# the repository's Hard-Rule guards. Ratchets, docs/policy gates and dashboards were removed
# (docs/ops/FORK_IDENTITY.md). Pull requests run the fast lane; pushes to main and manual
# dispatches also run the packaging, E2E, integration, ecosystem and Bun lanes, plus a
# report-only coverage merge on main.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` reruns CI when a PR is retargeted (a stacked PR whose base merged). A title or
    # body edit also sends `edited`: that run gets its own concurrency group, so it never
    # cancels the real run, and it skips every job.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'edited' && !github.event.changes.base) && format('-text-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI must never mutate the runner's OS trust store (tests/_setup/isolateDataDir.ts).
  OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
  CI_NODE_VERSION: "26"

# Job timeouts: the work measured in dispatch 45306431369 plus at least 12.5 minutes for the
# install action's worst case (three timed-out attempts and the verify step, 730 s;
# .github/actions/pnpm-install-retry).

jobs:
  changes:
    name: Change Classification
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      i18n: ${{ steps.classify.outputs.i18n }}
      testsOnly: ${{ steps.classify.outputs.testsOnly }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      # Pushes and dispatches enable every lane; a PR is classified from its diff
      # (scripts/quality/classify-pr-changes.mjs, unit-tested).
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "code=true"
              echo "i18n=true"
              echo "testsOnly=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a move, so moving code into docs/ still counts as code.
          # Three dots: diff from the merge base, so commits that landed only on the base after the
          # PR branched do not count as this PR's changes.
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          node scripts/quality/classify-pr-changes.mjs changed-files.txt >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Draft PRs and docs-only PRs skip the code lanes.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (needs.changes.outputs.code == 'true' || needs.changes.outputs.i18n == 'true')) }}
    env:
      # tsx gates (known-symbols, route-guard-membership) open SQLite on import.
      JWT_SECRET: ci-lint-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-lint-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history for the migration and test-discovery guards.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      - run: pnpm run lint
      # Hard-Rule guards (AGENTS.md).
      - run: pnpm run check:db-rules
      - run: pnpm run check:error-helper
      - run: pnpm run check:public-creds
      - run: pnpm run check:route-guard-membership
      - run: pnpm run check:route-validation:t06
      - run: pnpm run check:fetch-targets
      - run: pnpm run check:tracked-artifacts
      # Duplicate and malformed migration numbers only; the PR-base comparison is off.
      - run: pnpm run check:migration-numbering --no-base
      # Routing correctness.
      - run: pnpm run check:provider-consistency
      - run: pnpm run check:known-symbols
      - run: pnpm run check:model-lifecycle
      # Test hygiene: tests that would silently not run, undeclared imports.
      - run: pnpm run check:test-discovery
      - run: pnpm run check:test-tla-order
      - run: pnpm run check:vitest-exclusions
      - run: pnpm run check:deps
      # English catalogs: ICU messages compile, every CLI t() key exists.
      - run: pnpm run check:ui-icu
      - run: pnpm run check:cli-i18n
      # failure-threshold=error: the pre-existing warnings stay visible without blocking.
      - name: hadolint (Dockerfile)
        run: docker run --rm -i hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e hadolint --failure-threshold error - < Dockerfile

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run typecheck:core
      # next build ignores type errors, so the dashboard tree and the production program
      # are checked here against frozen baselines of pre-existing errors: only new errors fail.
      - run: pnpm run check:dashboard-typecheck
      - run: pnpm run check:build-typecheck
        timeout-minutes: 8

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Every ready PR, docs-only included: docs and catalogs can carry a committed secret too.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      # check:codeql-ratchet reads open code-scanning alerts.
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # gitleaks scans the history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run audit:deps
      - run: pnpm run check:lockfile
      - run: pnpm run check:licenses
      # Pinned, checksum-verified gitleaks / osv-scanner / actionlint / zizmor. A failed
      # install fails the job: a missing scanner is not a zero-finding result.
      - name: Install pinned scanners
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/install-quality-scanners.sh
      # The scanners are ratchets on purpose: they fail on findings above the counts frozen
      # in config/quality/quality-baseline.json, so known debt does not block every PR.
      - run: pnpm run check:secrets --ratchet
      - run: pnpm run check:vuln-ratchet --ratchet
      - run: pnpm run check:workflows --ratchet
      # --require-measurement: fail when the API cannot be read or the repository has no CodeQL
      # analysis, so an empty alert list is never taken as zero alerts. The count covers the
      # repository's open alerts (default setup scans main), not this revision.
      - run: pnpm run check:codeql-ratchet --require-measurement
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      # Webpack on hosted runners: a Turbopack build of this tree needs far more than their
      # 16 GB (tests/unit/ci-build-bundler-webpack.test.ts).
      - run: pnpm run build
        env:
          OMNIROUTE_USE_TURBOPACK: "0"
      - name: Verify colocated compression worker
        run: node --import tsx/esm --test tests/integration/compression-worker-standalone.int.test.ts
        env:
          RUN_STANDALONE_INT: "1"
      - name: Verify colocated LLMLingua worker
        run: node --import tsx/esm --test tests/integration/llmlingua-worker-standalone.int.test.ts
        env:
          RUN_STANDALONE_INT: "1"
      # tar keeps paths relative to the workspace (.build/next/...); the standalone
      # node_modules stays intact for the package job.
      - name: Archive Next.js build for downstream jobs
        if: ${{ github.event_name != 'pull_request' }}
        run: tar -czf "$RUNNER_TEMP/e2e-build.tar.gz" --exclude='.build/next/cache' .build/next
      - name: Upload Next.js build for downstream jobs
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: ${{ runner.temp }}/e2e-build.tar.gz
          retention-days: 1

  test-unit:
    name: Unit Tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Shards took 12.8-16.6 min under c8 in dispatch 45306431369.
    timeout-minutes: 35
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      TEST_SHARD: ${{ matrix.shard }}/8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      - run: pnpm run test:unit:ci:shard

  # Report only, pushes to main only: a second, instrumented run of the unit shards, so a
  # coverage or artifact failure can never fail the blocking Unit Tests jobs or the gate.
  coverage-shard:
    name: Coverage Shard (${{ matrix.shard }}/8, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      TEST_SHARD: ${{ matrix.shard }}/8
    steps:
      # Raw V8 coverage filled the hosted runner disk on 2026-11-02.
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      # NODE_OPTIONS: the c8 parent aggregates the raw coverage JSON and needs the larger heap.
      - name: Unit tests (shard ${{ matrix.shard }}/8) with V8 coverage
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm exec c8 --merge-async \
            --temp-directory=coverage-shard \
            --reports-dir=coverage-shard-report \
            --reporter=json \
            --exclude=tests/** \
            --exclude=**/*.test.* \
            pnpm run test:unit:ci:shard
      # Only a shard that finished uploads: the merge counts artifacts to detect a partial run.
      - name: Upload raw shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard/*.json
          if-no-files-found: error
          retention-days: 1

  test-vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run test:vitest
      - run: pnpm run test:vitest:ui

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      - run: pnpm run test:security

  # ── main / dispatch only ─────────────────────────────────────────────────────────────
  # Before merging a PR that needs these lanes: gh workflow run ci.yml --ref <branch>.

  package-artifact:
    name: Package Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    env:
      JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: next-build-artifact
      - run: tar -xzf next-build-artifact/e2e-build.tar.gz
      # build:cli assembles dist/ from the downloaded standalone build.
      - run: pnpm run build:cli
      - name: Assert dist/server.js exists
        run: test -f dist/server.js || (echo "dist/server.js missing — build:cli did not assemble correctly" && exit 1)
      # check:pack-artifact's provenance guard (#10427) rejects a dist/ without BUILD_SHA,
      # and checks it is an ancestor of the branch under test.
      - name: Stamp dist/BUILD_SHA
        env:
          OMNIROUTE_BUILD_SHA: ${{ github.sha }}
        run: |
          export OMNIROUTE_BUILD_SHA="${OMNIROUTE_BUILD_SHA:0:7}"
          node scripts/build/write-build-sha.mjs
      # GITHUB_REF is the full ref (refs/heads/... or refs/tags/...), so a dispatch from a tag
      # works too.
      - name: Fetch the provenance ref
        run: git fetch --no-tags --depth=50 origin "+$GITHUB_REF:refs/remotes/origin/ci-provenance"
      - run: pnpm run check:pack-artifact
        env:
          OMNIROUTE_RELEASE_REF: origin/ci-provenance
      # Packs the real tarball, installs it into a clean prefix and boots it to a healthy
      # /api/monitoring/health.
      - run: pnpm run check:pack-boot

  test-e2e:
    name: E2E Tests (${{ matrix.shard }}/9)
    runs-on: ubuntu-latest
    # Balanced shards took 1.4-3.5 min (run 45306431369); the plain --shard fallback's worst
    # shard was 24m47s, plus install and browser setup.
    timeout-minutes: 45
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      OMNIROUTE_PLAYWRIGHT_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 10
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: next-build-artifact
      - run: tar -xzf next-build-artifact/e2e-build.tar.gz
      # Duration-balanced shards (config/quality/e2e-timings.json); the balancer falls back
      # to plain --shard, never to fewer specs.
      - name: Run E2E tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if FILES=$(node scripts/quality/balance-e2e-shards.mjs "$SHARD" 9); then
            if [ -z "$FILES" ]; then echo "[e2e-balance] shard $SHARD has no files"; exit 0; fi
            echo "[e2e-balance] shard $SHARD runs:"; echo "$FILES"
            # FILES is our own newline-separated path list, so word-splitting is intended
            # shellcheck disable=SC2086,SC2046
            pnpm exec playwright test $(echo "$FILES" | tr '\n' ' ') --reporter=line
          else
            echo "[e2e-balance] balancer unavailable — plain --shard fallback"
            pnpm exec playwright test tests/e2e/*.spec.ts --shard="$SHARD"/9 --reporter=line
          fi

  test-integration:
    name: Integration Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      INITIAL_PASSWORD: ci-test-password-for-integration
      DATA_DIR: /tmp/omniroute-ci-${{ matrix.shard }}
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      TEST_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      - run: pnpm run test:integration:ci

  # Boots a real OmniRoute and drives it over HTTP; needs no provider credentials.
  test-ecosystem:
    name: Ecosystem E2E (live server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: ${{ github.event_name != 'pull_request' }}
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - run: pnpm run check:node-runtime
      - run: pnpm run test:ecosystem

  # The bun:sqlite path is best-effort (AGENTS.md → Environment); Linux only.
  test-bun-sqlite:
    name: Bun SQLite Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      # Bun is a pinned devDependency (AGENTS.md → Environment), so pnpm install provides it.
      - run: pnpm run test:bun:db

  # Report only: merges the shard coverage into a summary. Not part of the gate.
  coverage:
    name: Coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: coverage-shard
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/pnpm-install-retry
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          # One directory per shard artifact, so the merge can count them.
          path: coverage-raw/
      - name: Merge and report
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          # The shard jobs are continue-on-error, so their result says nothing: count the
          # artifacts that arrived. A failed shard uploads nothing (if-no-files-found: error).
          arrived=$(find coverage-raw -mindepth 1 -maxdepth 1 -type d -name 'coverage-shard-*' | wc -l)
          if [ "$arrived" -ne 8 ]; then
            echo "::warning::Coverage is PARTIAL: $arrived of 8 shard artifacts arrived."
            echo "> **Partial coverage:** $arrived of 8 shard artifacts arrived." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p coverage-shards
          find coverage-raw -type f -name '*.json' -exec mv -t coverage-shards/ {} +
          pnpm exec c8 report \
            --temp-directory coverage-shards \
            --reports-dir coverage \
            --merge-async \
            --reporter=text-summary \
            --reporter=json-summary \
            --exclude=tests/** \
            --exclude=**/*.test.*
          node scripts/check/test-report-summary.mjs \
            --input coverage/coverage-summary.json \
            --output coverage/coverage-report.md \
            --threshold 60
          cat coverage/coverage-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/coverage-summary.json
          if-no-files-found: warn

  # The one check to require: fails when any blocking job failed or was cancelled. Skipped
  # jobs (draft or docs-only PRs, main-only lanes on PRs) pass.
  gate:
    # A title/body edit run must not post a skipped "Gate / CI" over the real run's result.
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Gate / CI (text edit, skipped)' || 'Gate / CI' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A draft PR runs no tests, so it gets no gate result (a green gate would claim it was tested).
    if: ${{ always() && !(github.event.action == 'edited' && !github.event.changes.base) && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    needs:
      - changes
      - lint
      - typecheck
      - security
      - build
      - test-unit
      - test-vitest
      - test-security
      - package-artifact
      - test-e2e
      - test-integration
      - test-ecosystem
      - test-bun-sqlite
    steps:
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          bad=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"')
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' \
            | { echo "| Job | Result |"; echo "|-----|--------|"; cat; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$bad" ]; then
            echo "::error::Blocking jobs did not pass:"
            echo "$bad"
            exit 1
          fi
