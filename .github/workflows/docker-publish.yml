name: Publish Docker images

# Publishes ghcr.io/misileremielle/omniroute (+ -web) for linux/amd64 and linux/arm64 on
# GitHub-hosted runners: main → :latest (main is its only writer), a GitHub release →
# :<version>. Each per-arch image, base and web, is smoke-tested and must pass the Trivy
# CRITICAL gate before any tag points at it.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
  # 'released' fires only on the first publication (or pre-release → release), so editing
  # an old release does not republish it.
  release:
    types: [released]
  workflow_dispatch:

# One publish per ref. A running publish is never cancelled (it could stop between the
# :latest and :latest-web writes); GitHub keeps only the newest pending run behind it.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

# The jobs that push to GHCR grant packages: write themselves.
permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Docker release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
      ghcr_image: ${{ steps.version.outputs.ghcr_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The :latest decision reads tag names from git ls-remote; no history needed.
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and skip flag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          GHCR_IMAGE="${GHCR_IMAGE_NAME:-ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY:-}" | tr '[:upper:]' '[:lower:]')}"
          echo "ghcr_image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"

          # main → latest (main owns :latest); a release tag → its version; any other
          # branch fails (the fork publishes no :next channel).
          VERSION=$(bash scripts/ci/resolve-docker-publish-version.sh "$EVENT_NAME" "$REF_TYPE" "$REF_NAME")
          # Only main may write :latest, and a version must not collide with a -web tag: any
          # other ref must resolve to a plain semver without a -web suffix (a tag named
          # vlatest or v1.2.3-web would otherwise overwrite another image's tag).
          if [ "$VERSION" = "latest" ]; then
            if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "main" ]; then
              echo "::error::Only main publishes :latest (got $REF_TYPE $REF_NAME)."
              exit 1
            fi
          else
            if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' ||
              printf '%s' "$VERSION" | grep -qE -- '-web$' ||
              # One spelling per version (v1.2.3, never 1.2.3), so two tags can't race for one image tag.
              [ "$REF_NAME" != "v$VERSION" ]; then
              echo "::error::$REF_TYPE $REF_NAME does not resolve to a publishable semver ($VERSION)."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Skip only when the Node and Web images are both complete in GHCR: an
          # existing Node base must not block repairing a missing Web image or
          # architecture. The floating `latest` (main) never skips.
          # Helper exit codes: 1 = missing or incomplete (publish), 2 = could not tell.
          SKIP="false"
          if [ "$VERSION" != "latest" ]; then
            SKIP="true"
            CHECK_REFS=("${GHCR_IMAGE}:${VERSION}" "${GHCR_IMAGE}:${VERSION}-web")
            for ref in "${CHECK_REFS[@]}"; do
              rc=0
              node scripts/ci/docker-image-complete.mjs "$ref" || rc=$?
              if [ "$rc" -eq 1 ]; then
                echo "$ref is missing or incomplete — publishing."
                SKIP="false"
                break
              fi
              if [ "$rc" -ne 0 ]; then
                echo "::error::Could not inspect $ref (registry error, not a missing tag). Not starting a rebuild on an unknown state: re-run this job once the registry recovers."
                exit 1
              fi
            done
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

          echo "Publishing ${GHCR_IMAGE}:$VERSION (skip=$SKIP)"

  build:
    name: Build Docker (${{ matrix.platform }})
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    # Hosted 16 GB runners; the Dockerfile build is sized for them (OMNIROUTE_BUILD_WORKERS,
    # #7518). Webpack on both arches. The last publish took ~15 min per arch (run 44888378550).
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    env:
      GHCR_IMAGE_NAME: ${{ needs.prepare.outputs.ghcr_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # .dockerignore drops .git, so the image build never reads history.
          fetch-depth: 1

      - name: Assert Docker Engine
        run: docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the dependency layers go to the GitHub Actions cache. They change with the
      # lockfile alone; the build layers change on every commit, and exporting them
      # (`mode=max` on the image builds) took ~7 min per publish on amd64 and never hit.
      # This step re-uses or refreshes the `deps` stage; the image builds below read it
      # back and export nothing. Within this job the builder keeps every layer locally,
      # so the Web build still re-uses the base build's layers.
      - name: Cache the dependency layers
        uses: docker/build-push-action@v7
        with:
          context: .
          target: deps
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=docker-deps-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-deps-${{ matrix.arch }},mode=max,ignore-error=true

      # Heap budget for webpack inside BuildKit: 12288 MB.
      # Validated on the hosted runners (16 GB) by the publishes of 2026-10-16/17 — runs
      # 38904652365, 38907575198 and 39010473398, amd64 and arm64 green (27-55 min). It stays
      # at or above the native webpack floor (10240 MB, run 39151150605), never below it
      # (tests/unit/docker-publish-build-heap-14325.test.ts).
      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ needs.prepare.outputs.ghcr_image }}
          cache-from: type=gha,scope=docker-deps-${{ matrix.arch }}
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Build and push WEB platform image by digest
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ needs.prepare.outputs.ghcr_image }}
          # runner-web extends runner-base: this job's builder already holds the base
          # build's layers, so only the dependency cache is read here.
          cache-from: type=gha,scope=docker-deps-${{ matrix.arch }}
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      # Check the binaries in both final Node images on each native architecture,
      # before their digests can reach the multi-arch manifest/promotion job.
      - name: Verify published Node runtimes
        env:
          DIGEST_BASE: ${{ steps.build.outputs.digest }}
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for digest in "$DIGEST_BASE" "$DIGEST_WEB"; do
            image="${GHCR_IMAGE_NAME}@${digest}"
            echo "Verifying Node runtime in ${image} (${PLATFORM})"
            docker run --rm --pull always --platform "$PLATFORM" --entrypoint node -i \
              "$image" --input-type=module < scripts/ci/check-docker-node-runtime.mjs
          done

      # Native per arch, before any tag exists. runner-web extends runner-base and keeps its
      # HEALTHCHECK.
      - name: Smoke-test the built images
        env:
          DIGEST_BASE: ${{ steps.build.outputs.digest }}
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$DIGEST_BASE" "$DIGEST_WEB"; do
            container="omniroute-smoke-${digest#sha256:}"
            image="${GHCR_IMAGE_NAME}@${digest}"
            docker run --detach --name "$container" "$image"
            healthy=false
            for _ in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if [ "$status" = "healthy" ]; then healthy=true; break; fi
              if [ "$status" = "unhealthy" ] || [ "$(docker inspect --format '{{.State.Status}}' "$container")" = "exited" ]; then
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              docker logs "$container"
              docker rm -f "$container" >/dev/null 2>&1 || true
              echo "::error::$image did not become healthy"
              exit 1
            fi
            echo "$image is healthy"
            docker rm -f "$container" >/dev/null
          done

      # Blocking: fail on a fixable CRITICAL CVE in the published image. ignore-unfixed:true so an unfixable base-image
      # CVE with no upstream patch does not red the release (reduces false-blocks);
      # a fixable CRITICAL still blocks. Per docs/security/SUPPLY_CHAIN.md. NB: Trivy
      # scans against a CVE DB that grows continuously — a newly-disclosed CRITICAL on
      # an unchanged base image can red this gate; the fix is to rebuild on a patched
      # base, bump the dep, or add a justified .trivyignore entry (see the CVE-variance
      # note in docs/security/SUPPLY_CHAIN.md).
      - name: Trivy CRITICAL gate (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # The accepted-risk list (#12084).
          trivyignores: .trivyignore

      - name: Trivy CRITICAL gate, web image (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE_NAME }}@${{ steps.build-web.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Export digests
        env:
          DIGEST_BASE: ${{ steps.build.outputs.digest }}
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          # Self-hosted runners keep /tmp across runs: start empty so digests of
          # earlier runs are never uploaded (#15184).
          rm -rf /tmp/digests
          mkdir -p /tmp/digests/base /tmp/digests/web
          touch "/tmp/digests/base/${DIGEST_BASE#sha256:}"
          touch "/tmp/digests/web/${DIGEST_WEB#sha256:}"

      - name: Upload base digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/base/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload web digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-web-${{ matrix.arch }}
          path: /tmp/digests/web/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifests
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE_NAME: ${{ needs.prepare.outputs.ghcr_image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Manifest validation must use the current workflow's helper on backfills.
          # Manifests, smoke test and scans read no git history.
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-base-*
          path: /tmp/digests/base
          merge-multiple: true

      - name: Download web digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-web-*
          path: /tmp/digests/web
          merge-multiple: true

      - name: Guard against stale digests
        run: |
          set -euo pipefail
          # Validate both flavors BEFORE moving any public tag. Counting alone cannot
          # distinguish two AMD64 images from AMD64 + ARM64.
          for dir in base web; do
            if [ ! -d "/tmp/digests/$dir" ]; then
              echo "Missing digest directory: $dir" >&2
              exit 1
            fi
            count=$(find "/tmp/digests/$dir" -type f | wc -l)
            if [ "$count" -gt 2 ] || [ "$count" -lt 2 ]; then
              echo "digests in $dir: found $count, expected exactly 2 (amd64 + arm64)" >&2
              exit 1
            fi
            refs=()
            while IFS= read -r digest_file; do
              refs+=("${GHCR_IMAGE_NAME}@sha256:$(basename "$digest_file")")
            done < <(find "/tmp/digests/$dir" -type f | sort)
            if ! node scripts/ci/docker-image-complete.mjs "${refs[@]}"; then
              echo "digests in $dir: the pair is not one linux/amd64 + one linux/arm64" >&2
              exit 1
            fi
          done

      # The per-arch images were smoke-tested and scanned in the build job, so the public
      # tags only ever point at validated images; prepare skips a version whose tags exist.
      - name: Create GHCR version manifests
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1" suffix="$2" dir="$3"
            local refs=()
            while IFS= read -r digest_file; do
              refs+=("${image}@sha256:$(basename "$digest_file")")
            done < <(find "$dir" -type f | sort)
            node scripts/ci/docker-image-complete.mjs "${refs[@]}"
            docker buildx imagetools create -t "${image}:${VERSION}${suffix}" "${refs[@]}"
          }

          create_manifest "${GHCR_IMAGE_NAME}" "" /tmp/digests/base
          create_manifest "${GHCR_IMAGE_NAME}" "-web" /tmp/digests/web

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE_NAME}:${VERSION}"
