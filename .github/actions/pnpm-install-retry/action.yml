name: pnpm install with retry
description: >-
  Install dependencies. Restores node_modules from the Actions cache when the exact
  lockfile / runner / Node version / postinstall inputs match; otherwise runs pnpm install
  with retries for transient registry/network failures and saves the tree for the
  next run.
inputs:
  cache:
    description: Set to "false" to skip the node_modules cache and always run pnpm install.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Select the lockfile-compatible pnpm version
      id: pnpm
      shell: bash
      run: |
        set -euo pipefail
        expected=$(node -p "require('./config/ci/toolchain.json').pnpm")
        if ! [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid pinned pnpm version" >&2
          exit 1
        fi
        # Every network-touching command below is bounded; see the timing note on the install step.
        if [ "$(timeout --kill-after=5 30 pnpm --version 2>/dev/null || true)" != "$expected" ]; then
          timeout --kill-after=10 120 npm install --global "pnpm@$expected" --no-audit --no-fund ||
            { sleep 15; timeout --kill-after=10 120 npm install --global "pnpm@$expected" --no-audit --no-fund; }
        fi
        actual=$(timeout --kill-after=5 30 pnpm --version)
        if [ "$actual" != "$expected" ]; then
          echo "pnpm version differs from the lockfile toolchain" >&2
          exit 1
        fi
        echo "version=$actual" >> "$GITHUB_OUTPUT"

    - name: Resolve Node version for the cache key
      id: node
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    # #8084 D3 (plan 3.8.51 task 5): every job used to pay ~80-90 s of install time even
    # with the package cache warm — 36 jobs per ci.yml run, ~55 min of
    # runner time per run just installing. A node_modules cache keyed on EVERYTHING
    # that shapes the tree lets a hit skip the install entirely.
    #
    # No restore-keys on purpose (same rule as the ESLint cache, #11600): a partial
    # tree from another lockfile / Node / postinstall script is exactly the kind of
    # silent drift a lockfile-pinned CI must never inherit. Exact key or a full pnpm install.
    #
    # postinstall (scripts/build/postinstall.mjs + helpers) only mutates node_modules
    # on a plain install — its dist/ branch is gated on dist/ existing, which never
    # holds at install time in CI — so the cached tree already carries its effects.
    - name: Restore node_modules
      id: node-modules
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        # A stalled download segment aborts the restore (then pnpm installs) instead of
        # waiting out the action's 10-minute default.
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        path: node_modules
        key: node-modules-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/build/postinstall.mjs', 'scripts/build/postinstallSupport.mjs', 'scripts/build/colocateOptionals.mjs', 'scripts/build/wreqJsNative.mjs', 'scripts/build/fixPlaywrightAndroid.mjs', 'scripts/build/native-binary-compat.mjs', 'scripts/build/betterSqlitePrebuildTarget.mjs', 'scripts/ci/verify-ci-install.mjs', '.github/actions/pnpm-install-retry/action.yml') }}

    - name: pnpm install (with retry)
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: "skip"
      run: |
        set -euo pipefail

        max_attempts=3
        delay_seconds=20
        # Each attempt is bounded. CI run 45321347928 (Build job 138203058220) sat 40 min in
        # this install: the log stops after the root postinstall's .env sync and the runner
        # later killed orphan pnpm/sh/node processes. A cold install of this whole action took
        # 24-38 s on Linux in runs 45306431369 and 45321347928 (the fork has no Windows job now),
        # so a hung attempt exits 124 at 150 s and the loop retries it.
        # Worst case for the loop: 3 x (150 s + 30 s kill grace) + 20 s + 40 s backoff = 600 s;
        # the 130 s verify bound and the pnpm bootstrap step above (up to 345 s) bring the
        # bounded steps to 1,075 s (18 min). The node_modules cache restore is not capped. Every
        # job timeout-minutes in ci.yml is its measured work plus at least 20 min of headroom.
        attempt_timeout_seconds=150

        for attempt in $(seq 1 "$max_attempts"); do
          if [ "$attempt" -gt 1 ]; then
            echo "pnpm install attempt $attempt/$max_attempts after transient failure"
          fi

          if timeout --kill-after=30 "$attempt_timeout_seconds" pnpm install --frozen-lockfile; then
            exit 0
          else
            exit_code=$?
          fi

          if [ "$attempt" -eq "$max_attempts" ]; then
            exit "$exit_code"
          fi

          sleep "$delay_seconds"
          delay_seconds=$((delay_seconds * 2))
        done

    # Both cache hits and successful installs must execute the native runtimes.
    # A package directory alone cannot prove ABI compatibility or a usable binary.
    - name: Verify installed native runtimes
      id: verify-install
      shell: bash
      run: timeout --kill-after=10 120 node scripts/ci/verify-ci-install.mjs

    - name: node_modules restored from cache
      if: steps.node-modules.outputs.cache-hit == 'true'
      shell: bash
      run: echo "node_modules restored from cache (key hit) — pnpm install skipped"
